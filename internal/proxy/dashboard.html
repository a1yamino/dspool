<style>
  :root {
    color-scheme: light;
    --bg: #f6f8fb;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --surface-3: #f1f5f9;
    --border: #e2e8f0;

    --text: #0f172a;
    --text-2: #334155;
    --muted: #64748b;
    --faint: #94a3b8;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #eff6ff;
    --on-accent: #ffffff;
    --success: #15803d;
    --success-soft: #f0fdf4;
    --warning: #b45309;
    --warning-soft: #fffbeb;
    --danger: #b91c1c;
    --danger-soft: #fef2f2;
    --neutral: #5b6a7a;
    --neutral-soft: #f1f5f9;
    --focus: #2563eb;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
    --shadow-md: 0 4px 16px rgba(15, 23, 42, .06);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0b1117;
      --surface: #111a22;
      --surface-2: #0f1720;
      --surface-3: #1a2531;
      --border: #243240;
      --border-strong: #33475a;
      --text: #e8eef5;
      --text-2: #c3cfdb;
      --muted: #8fa0b2;
      --faint: #6f8193;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --accent-soft: #12263e;
      --on-accent: #07121e;
      --success: #4ade80;
      --success-soft: #0e2a1b;
      --warning: #fbbf24;
      --warning-soft: #2a2110;
      --danger: #f87171;
      --danger-soft: #2c1717;
      --neutral: #a0adba;
      --neutral-soft: #1c2834;
      --focus: #60a5fa;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .26);
      --shadow-md: 0 8px 28px rgba(0, 0, 0, .22);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b1117;
    --surface: #111a22;
    --surface-2: #0f1720;
    --surface-3: #1a2531;
    --border: #243240;
    --border-strong: #33475a;
    --text: #e8eef5;
    --text-2: #c3cfdb;
    --muted: #8fa0b2;
    --faint: #6f8193;
    --accent: #60a5fa;
    --accent-hover: #93c5fd;
    --accent-soft: #12263e;
    --on-accent: #07121e;
    --success: #4ade80;
    --success-soft: #0e2a1b;
    --warning: #fbbf24;
    --warning-soft: #2a2110;
    --danger: #f87171;
    --danger-soft: #2c1717;
    --neutral: #a0adba;
    --neutral-soft: #1c2834;
    --focus: #60a5fa;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .26);
    --shadow-md: 0 8px 28px rgba(0, 0, 0, .22);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--accent-soft); color: var(--text); }
  a { color: inherit; }
  button, input, select { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  code, .mono { font-family: var(--mono); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .icon {
    width: 15px; height: 15px; flex: none;
    fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* top bar */
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
  .topbar-inner {
    width: min(1220px, 100%); margin: 0 auto; padding: 0 28px; height: 60px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; }
  .brand-mark {
    width: 28px; height: 28px; flex: none; display: grid; place-items: center;
    border-radius: 8px; background: var(--accent); color: var(--on-accent);
  }
  .brand-name { font-size: 18px; font-weight: 650; letter-spacing: -.035em; }
  .brand-sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .updated { margin-right: 4px; color: var(--muted); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .lang-switch {
    display: inline-flex; align-items: center; gap: 2px; padding: 2px;
    border: 1px solid var(--border); border-radius: 7px; background: var(--surface-2);
  }
  .lang-switch button {
    height: 24px; padding: 0 8px; border: 0; border-radius: 5px;
    background: transparent; color: var(--muted); font-size: 11px; font-weight: 500; cursor: pointer;
  }
  .lang-switch button:hover { color: var(--text); }
  .lang-switch button.active { background: var(--accent); color: var(--on-accent); }
  .icon-btn {
    width: 34px; height: 34px; flex: none; display: inline-grid; place-items: center;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
    color: var(--text-2); cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .icon-btn:hover { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
  .icon-btn.small { width: 28px; height: 28px; border-color: transparent; background: transparent; border-radius: 6px; color: var(--muted); }
  .icon-btn.small:hover { background: var(--surface-3); color: var(--text); }
  .btn {
    height: 34px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface);
    color: var(--text); font-size: 12px; font-weight: 550; white-space: nowrap; cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .live-toggle {
    height: 34px; padding: 0 10px; display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
    color: var(--text-2); font-size: 11.5px; cursor: pointer;
  }
  .live-toggle:hover { background: var(--surface-2); border-color: var(--border-strong); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex: none; }
  .live-toggle.paused .live-dot { background: var(--faint); }
  .live-toggle.offline .live-dot { background: var(--danger); }
  .spinning .icon { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* page */
  .page { width: min(1220px, 100%); margin: 0 auto; padding: 28px 28px 48px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .page-head h1 { margin: 0; font-size: 24px; line-height: 1.15; font-weight: 650; letter-spacing: -.03em; }
  .page-head p { margin: 5px 0 0; font-size: 13px; color: var(--muted); }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px;
    border-radius: 6px; background: var(--neutral-soft); color: var(--neutral);
    font-size: 11.5px; font-weight: 500; white-space: nowrap;
  }
  .status-pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .status-pill[data-tone="good"] { background: var(--success-soft); color: var(--success); }
  .status-pill[data-tone="warn"] { background: var(--warning-soft); color: var(--warning); }
  .status-pill[data-tone="bad"] { background: var(--danger-soft); color: var(--danger); }

  /* banner */
  .banner {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    padding: 10px 12px; margin-bottom: 16px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); color: var(--text-2); font-size: 12px; line-height: 1.45;
  }
  .banner[data-tone="warn"] { background: var(--warning-soft); border-color: transparent; color: var(--warning); }
  .banner[data-tone="bad"] { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
  .banner[data-tone="neutral"] { background: var(--surface-2); border-color: var(--border); color: var(--text-2); }
  .banner-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .banner-text { flex: 1 1 260px; min-width: 0; }
  .banner-action {
    height: 28px; padding: 0 9px; margin-left: auto;
    border: 1px solid currentColor; border-radius: 6px; background: transparent;
    color: inherit; font-size: 11px; cursor: pointer;
  }
  .banner-action:hover { background: var(--surface); }

  /* KPI cards */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi {
    min-width: 0; padding: 16px 18px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow-sm);
  }
  .kpi-label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .kpi-value {
    margin: 8px 0 3px; color: var(--text);
    font-size: 30px; line-height: 1; font-weight: 600; letter-spacing: -.035em;
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kpi-value.balance { display: flex; align-items: baseline; gap: 2px; }
  .kpi-value .cur { color: var(--accent); font-size: 14px; font-weight: 600; }
  .kpi-value .dec { color: var(--muted); font-size: 17px; font-weight: 500; }
  .kpi-value.empty { color: var(--muted); font-size: 26px; font-weight: 400; }
  .kpi-sub { min-height: 1.45em; color: var(--muted); font-size: 11.5px; line-height: 1.45; overflow-wrap: anywhere; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; background: var(--neutral); }
  .dot.hot { background: var(--success); }
  .dot.cooling { background: var(--warning); }
  .dot.cold { background: var(--accent); }
  .dot.probing { background: var(--neutral); }
  .dot.revoked { background: var(--danger); }

  /* keys panel */
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow-sm); overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; padding: 16px 18px 12px;
  }
  .panel-head h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.015em; }
  .panel-head p { margin: 3px 0 0; font-size: 11.5px; color: var(--muted); }
  .panel-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .search { position: relative; }
  .search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--muted); pointer-events: none; }
  .search input {
    width: 230px; height: 34px; padding: 0 10px 0 31px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); font-size: 12px;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .select-wrap { position: relative; }
  .select-wrap .icon { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--muted); pointer-events: none; }
  .select-wrap select {
    height: 34px; padding: 0 29px 0 10px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); color: var(--text-2);
    font-size: 12px; appearance: none; cursor: pointer;
  }
  .select-wrap select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .filters { display: flex; align-items: center; gap: 6px; padding: 0 18px 12px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    height: 28px; padding: 0 9px; border: 1px solid var(--border); border-radius: 6px;
    background: transparent; color: var(--text-2); font-size: 11.5px; cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .chip:hover { background: var(--surface-2); }
  .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .chip-count { font-family: var(--mono); font-size: 10px; opacity: .65; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th {
    padding: 8px 12px; text-align: left; white-space: nowrap;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    background: var(--surface-2); color: var(--muted); font-size: 11px; font-weight: 500;
  }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text-2); vertical-align: middle; }
  th:first-child, td:first-child { padding-left: 18px; }
  th:last-child, td:last-child { padding-right: 18px; }
  tbody tr:last-child td { border-bottom: 0; }
  .key-row { cursor: pointer; transition: background .12s ease; }
  .key-row:hover { background: var(--surface-2); }
  .key-label { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-size: 12.5px; font-weight: 600; }
  .key-mask { margin-top: 2px; color: var(--muted); font-family: var(--mono); font-size: 10px; white-space: nowrap; }
  .key-row.is-revoked .key-label { color: var(--danger); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 500; white-space: nowrap;
  }
  .badge .dot { width: 5px; height: 5px; }
  .badge.hot { background: var(--success-soft); color: var(--success); }
  .badge.cooling { background: var(--warning-soft); color: var(--warning); }
  .badge.cold { background: var(--accent-soft); color: var(--accent); }
  .badge.probing { background: var(--neutral-soft); color: var(--neutral); }
  .badge.revoked { background: var(--danger-soft); color: var(--danger); }
  .money { font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .money.muted { color: var(--muted); }
  .load { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
  .time { font-size: 11px; color: var(--text-2); white-space: nowrap; }
  .time.muted { color: var(--muted); }
  .stat-main { font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .stat-sub { margin-top: 1px; color: var(--muted); font-family: var(--mono); font-size: 9.5px; white-space: nowrap; }
  .cell-error { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; }
  .cell-actions { text-align: right; white-space: nowrap; }
  .row-actions { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .btn-restore {
    height: 26px; padding: 0 7px; border: 1px solid var(--border-strong);
    border-radius: 6px; background: var(--surface); color: var(--text-2);
    font-size: 10.5px; cursor: pointer;
  }
  .btn-restore:hover { border-color: var(--danger); color: var(--danger); }
  .btn-restore:disabled { opacity: .55; cursor: wait; }
  [data-action="expand"] .icon { transition: transform .15s ease; }
  [data-action="expand"][aria-expanded="true"] .icon { transform: rotate(180deg); }
  .detail-row td { padding: 0; background: var(--surface-2); border-bottom: 1px solid var(--border); }
  .detail { display: grid; grid-template-columns: 1fr .95fr 1.25fr; gap: 24px; padding: 18px 20px 20px; }
  .detail h3 { margin: 0 0 9px; color: var(--muted); font-size: 10.5px; font-weight: 600; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 11px; }
  .kv dt { color: var(--muted); white-space: nowrap; }
  .kv dd {
    margin: 0; color: var(--text-2); font-family: var(--mono); font-size: 10.5px;
    font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
  }
  .detail-error { border-left: 1px solid var(--border); padding-left: 20px; }
  .detail-error p { margin: 0; color: var(--text-2); font-size: 11.5px; line-height: 1.6; overflow-wrap: anywhere; white-space: pre-wrap; }
  .detail-id { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 10.5px; }
  .detail-id code {
    padding: 2px 6px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--surface); color: var(--text-2); font-family: var(--mono); font-size: 10px;
    overflow-wrap: anywhere;
  }
  .message-row td { padding: 44px 18px; text-align: center; color: var(--muted); }
  .empty-title { color: var(--text); font-size: 13.5px; font-weight: 600; }
  .empty-sub { margin-top: 4px; font-size: 11.5px; }

  /* footer */
  .meta {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px 20px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border);
  }
  .meta-item { min-width: 0; }
  .meta-label { display: block; margin-bottom: 2px; color: var(--muted); font-size: 10.5px; }
  .meta-value { display: block; color: var(--text-2); font-family: var(--mono); font-size: 10.5px; overflow-wrap: anywhere; }

  /* toast */
  .toast {
    position: fixed; right: 20px; bottom: 20px; z-index: 40;
    max-width: min(380px, calc(100vw - 32px)); padding: 10px 12px;
    border-radius: 8px; background: var(--text); color: var(--surface);
    font-size: 12px; line-height: 1.45; box-shadow: var(--shadow-md);
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity .16s ease, transform .16s ease;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast.error { background: var(--danger); color: #fff; }

  @media (max-width: 1100px) {
    .updated { display: none; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 760px) {
    .topbar-inner { height: auto; padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
    .top-actions { width: 100%; justify-content: space-between; gap: 6px; }
    .page { padding: 20px 16px 36px; }
    .page-head { align-items: flex-start; gap: 10px; }
    .page-head h1 { font-size: 21px; }
    .panel-head { align-items: flex-start; padding: 14px 16px 10px; }
    .panel-tools { width: 100%; }
    .search { flex: 1 1 100%; }
    .search input { width: 100%; }
    .select-wrap { flex: 1 1 auto; }
    .select-wrap select { width: 100%; }
    .filters { flex-wrap: wrap; overflow: visible; padding: 0 16px 10px; }
    .table-wrap { overflow: visible; }
    table, thead, tbody, tr, td { display: block; }
    thead { display: none; }
    tbody { display: block; }
    tr.key-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "state actions"
        "key key"
        "balance load"
        "next next"
        "error error";
      gap: 9px 14px; padding: 14px 16px; border-top: 1px solid var(--border);
    }
    tr.key-row:hover { background: var(--surface); }
    tr.key-row td { padding: 0; border: 0; }
    .cell-state { grid-area: state; }
    .cell-key { grid-area: key; padding-top: 10px !important; border-top: 1px solid var(--border) !important; }
    .cell-balance { grid-area: balance; }
    .cell-load { grid-area: load; text-align: right; }
    .cell-checked, .cell-stats { display: none; }
    .cell-next { grid-area: next; }
    .cell-error {
      grid-area: error; max-width: none; white-space: normal;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;

      content: attr(data-label); display: block; margin-bottom: 2px;

    }
    .cell-load::before { text-align: right; }
    .detail-row { display: block; }
    .detail-row td { display: block; padding: 0; }

    .meta { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  }
  @media (max-width: 520px) {
    .brand-sub { display: none; }

  const state = {
    data: null,
    derived: null,
    error: '',
    lastUpdated: 0,
    live: storageGet('dspool-live') !== '0',
    lang: storageGet('dspool-lang') === 'zh' ? 'zh' : 'en',
    filter: 'all',
    query: '',
    sort: storageGet('dspool-sort') || 'state',
    expanded: new Set(),
    loading: false,
    probing: false,
    reloading: false,
    fetchSeq: 0,
    filters: new Map(),
    timer: null,
    toastTimer: null,
  };
  let nf0;
  let nf2;
  let dateFmt;

  function storageGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function storageSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }
  function t(key, vars) {
    const dict = DICT[state.lang] || DICT.en;
    let value = dict[key];
    if (value === undefined) value = DICT.en[key];
    if (value === undefined) return key;
    if (typeof value === 'function') return value(vars || {});
    return String(value).replace(/\{(\w+)\}/g, (_, name) => (vars && vars[name] !== undefined ? vars[name] : '{' + name + '}'));
  }
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = String(text);
    return node;
  }
  function icon(name) {
    return '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"></use></svg>';
  }
  function locale() {
    return state.lang === 'zh' ? 'zh-CN' : 'en-US';
  }
  function updateFormatters() {
    nf0 = new Intl.NumberFormat(locale());
    nf2 = new Intl.NumberFormat(locale(), { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    dateFmt = new Intl.DateTimeFormat(locale(), {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    });
  }
  function formatInt(value) {
    return nf0.format(Number(value) || 0);
  }
  function money(value, currency) {
    const n = Number(value);
    if (!Number.isFinite(n)) return '—';
    const symbol = currency === 'CNY' ? '¥' : currency === 'USD' ? '$' : '';
    const amount = nf2.format(n);
    return symbol ? symbol + amount : (currency ? amount + ' ' + currency : amount);
  }
  function moneyParts(value, currency) {
    const amount = nf2.format(Number.isFinite(Number(value)) ? Number(value) : 0);
    const dot = amount.lastIndexOf('.');
    return {
      symbol: currency === 'CNY' ? '¥' : currency === 'USD' ? '$' : (currency || ''),
      int: dot >= 0 ? amount.slice(0, dot) : amount,
      dec: dot >= 0 ? amount.slice(dot + 1) : '00',
    };
  }
  const ZERO_MIN = Date.UTC(2000, 0, 1);
  function timeMs(value) {
    if (!value) return null;
    const t = Date.parse(value);
    return Number.isFinite(t) && t > ZERO_MIN ? t : null;
  }
  function fmtAbsolute(value) {
    const t = timeMs(value);
    return t === null ? '—' : dateFmt.format(new Date(t));
  }
  function inWords(seconds) {
    if (seconds < 60) return t('inSeconds', { n: seconds });
    if (seconds < 3600) return t('inMinutes', { n: Math.round(seconds / 60) });
    if (seconds < 86400) return t('inHours', { n: Math.round(seconds / 3600) });
    return t('inDays', { n: Math.round(seconds / 86400) });
  }
  function ago(value) {
    const ms = timeMs(value);
    if (ms === null) return '—';
    const s = Math.round((Date.now() - ms) / 1000);
    if (s < 0) return inWords(-s);
    if (s < 5) return t('justNow');
    if (s < 60) return t('secondsAgo', { n: s });
    if (s < 3600) return t('minutesAgo', { n: Math.round(s / 60) });
    if (s < 86400) return t('hoursAgo', { n: Math.round(s / 3600) });
    return t('daysAgo', { n: Math.round(s / 86400) });
  }
  function until(value) {
    const ms = timeMs(value);
    if (ms === null) return '—';
    const s = Math.round((ms - Date.now()) / 1000);
    if (s <= 0) return t('soon');
    return inWords(s);
  }
  function formatSeconds(seconds) {
    const s = Math.max(0, Math.round(Number(seconds) || 0));
    if (s < 60) return t('durationSeconds', { n: s });
    if (s < 3600) return t('durationMinutes', { n: Math.floor(s / 60) });
    if (s < 86400) {
      return t('durationHours', { h: Math.floor(s / 3600), m: Math.floor((s % 3600) / 60) });
    }
    return t('durationDays', { d: Math.floor(s / 86400), h: Math.floor((s % 86400) / 3600) });
  }
  function humanDuration(value) {
    const text = String(value || '');
    const match = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+(?:\.\d+)?)s)?$/.exec(text);
    if (!match || (!match[1] && !match[2] && !match[3])) return text || '—';
    const seconds = (Number(match[1]) || 0) * 3600 + (Number(match[2]) || 0) * 60 + (Number(match[3]) || 0);
    return formatSeconds(seconds);
  }
  function isCooling(key) {
    if (key.state !== 'hot') return false;
    const t = timeMs(key.cooldown_until);
    return t !== null && t > Date.now();
  }
  function visualState(key) {
    if (isCooling(key)) return 'cooling';
    return STATE_KEYS[key.state] ? key.state : 'probing';
  }
  function stateClass(value) {
    return value === 'invalid' ? 'revoked' : value;
  }
  function stateLabel(value) {
    return t(STATE_KEYS[value] || 'stateProbing');
  }
  function statsOf(key) {
    return key.stats && typeof key.stats === 'object' ? key.stats : {};
  }
  function derive(data) {
    const keys = Array.isArray(data && data.keys) ? data.keys : [];
    const counts = { total: keys.length, hot: 0, cooling: 0, cold: 0, probing: 0, invalid: 0 };
    let attempts = 0;
    let successes = 0;
    for (const key of keys) {
      const value = visualState(key);
      if (counts[value] !== undefined) counts[value] += 1;
      const stats = statsOf(key);
      attempts += Number(stats.attempts) || 0;
      successes += Number(stats.successes) || 0;
    }
    counts.hotTotal = counts.hot + counts.cooling;
    const totals = {};
    for (const key of keys) {
      if (key.state !== 'hot' || !key.balance_known) continue;
      const currency = key.currency || 'CNY';
      const balance = Number(key.balance);
      if (!Number.isFinite(balance)) continue;
      const group = totals[currency] || (totals[currency] = { currency, total: 0, keys: [] });
      group.total += balance;
      group.keys.push(key);
    }
    const currencies = Object.values(totals).sort((a, b) => b.total - a.total);
    return {
      keys,
      counts,
      attempts,
      successes,
      rate: attempts ? successes / attempts : null,
      currencies,
      primary: currencies[0] || null,
      hotKnown: currencies.reduce((sum, group) => sum + group.keys.length, 0),
    };
  }

  function applyStaticI18n() {

    });
    document.querySelectorAll('[data-i18n-title]').forEach((node) => {

    });

  function updateLanguageButtons() {
    document.querySelectorAll('[data-lang]').forEach((button) => {
      const active = button.dataset.lang === state.lang;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', active ? 'true' : 'false');

  function setLanguage(lang) {
    state.lang = lang === 'zh' ? 'zh' : 'en';
    storageSet('dspool-lang', state.lang);
    document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
    if (state.toastTimer) {
      clearTimeout(state.toastTimer);
      state.toastTimer = null;
    }
    $('toast').classList.remove('show');
    updateFormatters();
    document.title = t('documentTitle');
    applyStaticI18n();
    updateLanguageButtons();
    if (state.data) renderAll();
    else renderDisconnected();
    updateChrome();
    updateUpdated();

  function setStatus(label, tone) {
    $('status-label').textContent = label;
    $('status-pill').dataset.tone = tone;
  }

  function updateStatus() {
    if (!state.data) {
      setStatus(state.error ? t('statusOffline') : t('statusConnecting'), state.error ? 'bad' : 'neutral');
      return;
    }
    if (state.error) {
      setStatus(t('statusStale'), 'bad');
      return;
    }
    const counts = state.derived ? state.derived.counts : { total: 0, hot: 0, cooling: 0, cold: 0, probing: 0, invalid: 0 };
    if (counts.total === 0) setStatus(t('statusNoKeys'), 'neutral');
    else if (counts.hot > 0) setStatus(t('statusServing'), 'good');
    else if (counts.hotTotal > 0) setStatus(t('statusNoHot'), 'warn');
    else if (counts.cold > 0) setStatus(t('statusNoHot'), 'warn');
    else if (counts.probing > 0) setStatus(t('statusChecking'), 'neutral');
    else setStatus(t('statusAllInvalid'), 'bad');
  }

  function renderBalance(model) {
    const node = $('balance-value');
    node.replaceChildren();
    const primary = model.primary;
    if (primary) {
      node.classList.remove('empty');
      const parts = moneyParts(primary.total, primary.currency);
      node.append(
        el('span', 'cur', parts.symbol),
        el('span', 'amount', parts.int),
        el('span', 'dec', '.' + parts.dec)
      );
      node.setAttribute('aria-label', t('availableBalance') + ' ' + money(primary.total, primary.currency));
    } else {
      node.classList.add('empty');
      node.textContent = '—';
      node.setAttribute('aria-label', t('noBalance'));
    }
    const sub = [];
    if (primary) {
      sub.push(t('acrossHotKeys', { n: model.hotKnown }));
      const top = primary.keys.reduce((max, key) => Math.max(max, Number(key.balance) || 0), 0);
      if (primary.total > 0) sub.push(t('topKeyShare', { pct: Math.round((top / primary.total) * 100) }));
      const others = model.currencies.slice(1).filter((group) => group.total > 0);
      if (others.length) {
        sub.push(t('otherCurrencies', { list: others.map((group) => money(group.total, group.currency)).join(', ') }));
      }
    } else {
      sub.push(t('noBalance'));

    $('balance-sub').textContent = sub.join(t('listSeparator'));

  function initFilters() {
    const wrap = $('filters');
    wrap.replaceChildren();
    for (const filter of FILTERS) {
      const button = el('button', 'chip');
      button.type = 'button';
      button.dataset.filter = filter.id;
      if (filter.dot) button.append(el('i', 'dot ' + filter.dot));
      button.append(el('span', 'chip-label', t(filter.key)), el('span', 'chip-count', '0'));
      button.addEventListener('click', () => setFilter(filter.id));
      state.filters.set(filter.id, button);
      wrap.append(button);
    }
  }

  function updateFilters(counts) {
    for (const filter of FILTERS) {
      const button = state.filters.get(filter.id);
      if (!button) continue;
      const count = filter.id === 'all' ? counts.total : (counts[filter.id] || 0);

  function nameOf(key) {
    return key.label || key.mask || key.id;
  }

  function matches(key, query) {
    const stats = statsOf(key);
    const stateValue = visualState(key);
    const parts = [
      key.label, key.mask, key.id, key.state, key.last_error, stats.last_error,
      stateLabel(stateValue),
    ];
    return parts.some((part) => part && String(part).toLowerCase().includes(query));
  }

  function comparator(kind) {
    const order = { hot: 0, cooling: 1, cold: 2, probing: 3, invalid: 4 };
    return (a, b) => {
      if (kind === 'state') {
        const diff = (order[visualState(a)] || 0) - (order[visualState(b)] || 0);
        if (diff) return diff;
      }
      if (kind === 'state' || kind === 'balance-asc' || kind === 'balance-desc') {
        const av = a.balance_known ? Number(a.balance) : null;
        const bv = b.balance_known ? Number(b.balance) : null;
        if (av === null && bv !== null) return 1;
        if (av !== null && bv === null) return -1;
        if (av !== null && bv !== null && av !== bv) {
          const descending = kind === 'balance-desc' || kind === 'state';
          return descending ? bv - av : av - bv;
        }
      }
      if (kind === 'checked') {
        const at = timeMs(a.last_checked) || 0;
        const bt = timeMs(b.last_checked) || 0;
        if (at !== bt) return bt - at;
      }
      return String(nameOf(a)).localeCompare(String(nameOf(b)), locale(), { numeric: true });
    };
  }

  function badge(value) {

  function renderRows(model) {
    const body = $('rows');
    const active = document.activeElement;
    const focusAction = active && active.dataset ? active.dataset.action : null;
    const focusKey = active && active.dataset ? active.dataset.key : null;
    body.replaceChildren();

    if (!model) {
      $('keys-summary').textContent = '—';
      body.append(messageRow(
        state.error ? t('unableLoad') : t('loading'),
        state.error ? '' : ''
      ));
      return;
    }

    let keys = model.keys.slice();
    if (state.filter !== 'all') keys = keys.filter((key) => visualState(key) === state.filter);
    if (state.query) {
      const query = state.query.toLowerCase();
      keys = keys.filter((key) => matches(key, query));
    }
    keys.sort(comparator(state.sort));
    $('keys-summary').textContent = t('keysSummary', {
      shown: formatInt(keys.length), total: formatInt(model.keys.length),
    });

    if (!keys.length) {
      const noKeys = model.keys.length === 0;
      body.append(messageRow(
        noKeys ? t('noKeysYet') : t('noMatching'),
        noKeys ? t('addKeyHint') : t('tryDifferent')
      ));
      return;
    }

    for (const key of keys) {
      body.append(buildRow(key));
      if (state.expanded.has(key.id)) body.append(buildDetail(key));
    }

    if (focusAction && focusKey) {
      const target = body.querySelector(
        '[data-action="' + focusAction + '"][data-key="' + cssEscape(focusKey) + '"]'
      );
      if (target) target.focus({ preventScroll: true });
    }
  }

  function toggleExpanded(id) {
    if (state.expanded.has(id)) state.expanded.delete(id);
    else state.expanded.add(id);
    renderRows(state.derived);
    const target = document.querySelector('[data-action="expand"][data-key="' + cssEscape(id) + '"]');
    if (target) target.focus({ preventScroll: true });
  }

  function renderMeta(data) {
    const intervals = data.intervals || {};
    const items = [
      [t('endpoint'), data.listen || '—'],
      [t('daemon'), data.pid ? t('pidValue', { n: data.pid }) : t('notReported')],
      [t('version'), data.version || '—'],
      [t('uptime'), formatSeconds(data.uptime_seconds)],
      [t('strategy'), data.strategy || '—'],
      [t('defaultModel'), data.model_default || '—'],
      [t('balanceCheck'), humanDuration(intervals.balance)],
      [t('coldCheck'), humanDuration(intervals.cold)],
      [t('maxAttempts'), intervals.attempts ? String(intervals.attempts) : '—'],
      [t('log'), data.log_file || t('stderrForeground')],
    ];
    renderMetaItems(items);
  }

  function renderMetaEmpty() {
    const labels = ['endpoint', 'daemon', 'version', 'uptime', 'strategy', 'defaultModel', 'balanceCheck', 'coldCheck', 'maxAttempts', 'log'];
    renderMetaItems(labels.map((key) => [t(key), '—']));
  }

  function renderMetaItems(items) {
    const wrap = $('meta');
    wrap.replaceChildren();
    for (const [label, value] of items) {
      const item = el('div', 'meta-item');
      item.append(el('span', 'meta-label', label), el('span', 'meta-value', value));
      wrap.append(item);
    }
  }

  function renderBanner(model) {
    const banner = $('banner');
    const text = $('banner-text');
    const action = $('banner-action');

    if (!model && !state.error) {
      banner.hidden = true;
      return;
    }

    let tone = '';
    let title = '';
    let actionLabel = '';
    let actionFn = null;

    if (state.error) {
      tone = 'bad';
      title = t('bannerCannotConnect', { error: state.error });
      actionLabel = t('retry');
      actionFn = () => fetchData({ force: true });
    } else if (model.counts.total === 0) {
      tone = 'neutral';
      title = t('bannerNoKeys');
    } else if (model.counts.hot === 0) {
      if (model.counts.cold > 0) {
        tone = 'warn';
        title = t('bannerNoHotCold');
        actionLabel = t('refreshBalancesAction');
        actionFn = () => fetchData({ probe: true, force: true });
      } else if (model.counts.cooling > 0) {
        tone = 'warn';
        title = t('bannerAllCooling');
        actionLabel = t('refreshBalancesAction');
        actionFn = () => fetchData({ probe: true, force: true });
      } else if (model.counts.probing > 0) {
        tone = 'neutral';
        title = t('bannerChecking');
      } else if (model.counts.invalid > 0) {
        tone = 'bad';
        title = t('bannerAllInvalid');
      } else {
        tone = 'bad';
        title = t('bannerNoKeysAvailable');
      }
    }

    if (!title) {
      banner.hidden = true;
      return;
    }
    banner.hidden = false;
    banner.dataset.tone = tone;
    text.textContent = title;
    if (actionLabel) {
      action.hidden = false;
      action.textContent = actionLabel;
      action.onclick = actionFn;
    } else {
      action.hidden = true;
      action.onclick = null;
    }
  }

  function renderAll() {
    if (!state.data) {
      renderDisconnected();
      return;
    }
    const model = state.derived || derive(state.data);
    state.derived = model;
    renderKpis(model);
    updateFilters(model.counts);
    renderRows(model);
    renderMeta(state.data);
    renderBanner(model);
    updateStatus();
    updateChrome();
  }

  function renderDisconnected() {
    state.derived = null;
    renderKpisEmpty();
    updateFilters({ total: 0, hot: 0, cooling: 0, cold: 0, probing: 0, invalid: 0 });
    renderRows(null);
    renderMetaEmpty();
    renderBanner(null);
    updateStatus();
    updateUpdated();
    updateChrome();
  }

  function updateUpdated() {
    const node = $('updated');
    if (!state.lastUpdated) {
      node.textContent = state.error ? t('updatedFailed') : t('updatedConnecting');
      node.title = state.error || '';
      return;
    }
    const seconds = Math.max(0, Math.round((Date.now() - state.lastUpdated) / 1000));
    let text;
    if (seconds < 5) text = t('updatedJustNow');
    else if (seconds < 60) text = t('updatedSecondsAgo', { n: seconds });
    else if (seconds < 3600) text = t('updatedMinutesAgo', { n: Math.round(seconds / 60) });
    else text = t('updatedHoursAgo', { n: Math.round(seconds / 3600) });
    if (state.error) text = t('updatedFailed');
    else if (!state.live) text = t('updatedPaused', { text });
    node.textContent = text;
    node.title = dateFmt.format(new Date(state.lastUpdated));
  }

  function updateCountdowns() {
    document.querySelectorAll('.countdown[data-until]').forEach((node) => {
      node.textContent = until(node.dataset.until);
    });
    document.querySelectorAll('.js-ago[data-time]').forEach((node) => {
      node.textContent = ago(node.dataset.time);
    });
  }

  function updateLiveButton() {
    const button = $('live-btn');
    $('live-label').textContent = state.live ? t('live') : t('paused');
    button.classList.toggle('paused', !state.live);
    button.classList.toggle('offline', Boolean(state.error));
    button.setAttribute('aria-pressed', state.live ? 'true' : 'false');
    button.setAttribute('aria-label', state.live ? t('pauseLive') : t('resumeLive'));
  }

  function updateThemeButton() {
    const explicit = document.documentElement.dataset.theme;
    const dark = explicit === 'dark' || (!explicit && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const button = $('theme-btn');
    button.innerHTML = icon(dark ? 'sun' : 'moon');
    button.setAttribute('aria-label', dark ? t('themeLight') : t('themeDark'));
  }

  function updateChrome() {
    updateLiveButton();
    updateThemeButton();
    const button = $('refresh-btn');
    button.setAttribute('aria-label', state.probing ? t('checkingBalances') : t('refreshBalances'));
    $('refresh-label').textContent = state.probing ? t('checking') : t('refreshBalances');
    const reloadButton = $('reload-btn');
    reloadButton.setAttribute('aria-label', state.reloading ? t('reloading') : t('reloadKeysHint'));
    reloadButton.title = t('reloadKeysHint');
    $('reload-label').textContent = state.reloading ? t('reloading') : t('reloadKeys');
  }

  function setRefreshLoading(loading) {
    state.probing = loading;
    const button = $('refresh-btn');
    button.disabled = loading;
    button.classList.toggle('spinning', loading);
    button.setAttribute('aria-label', loading ? t('checkingBalances') : t('refreshBalances'));
    $('refresh-label').textContent = loading ? t('checking') : t('refreshBalances');
  }

  function setReloadLoading(loading) {
    state.reloading = loading;
    const button = $('reload-btn');
    button.disabled = loading;
    button.classList.toggle('spinning', loading);
    button.setAttribute('aria-label', loading ? t('reloading') : t('reloadKeysHint'));
    $('reload-label').textContent = loading ? t('reloading') : t('reloadKeys');
  }

  function schedule() {
    if (state.timer) {
      clearInterval(state.timer);
      state.timer = null;
    }
    if (!state.live) return;
    state.timer = setInterval(() => {
      if (document.visibilityState === 'visible') fetchData();
    }, 5000);
  }

  async function fetchData(options) {
    const opts = options || {};
    const probe = Boolean(opts.probe);
    const reload = Boolean(opts.reload);
    const force = Boolean(opts.force);
    if (state.loading && !force) return;
    const seq = ++state.fetchSeq;
    state.loading = true;
    if (probe) setRefreshLoading(true);
    if (reload) setReloadLoading(true);
    try {
      const endpoint = reload ? '/dashboard/reload' : probe ? '/dashboard/refresh' : '/dashboard/data';
      const response = await fetch(endpoint, {
        method: reload || probe ? 'POST' : 'GET',
        cache: 'no-store',
        headers: reload || probe ? { 'Content-Type': 'application/json' } : undefined,
      });
      if (!response.ok) {
        const detail = await response.json().catch(() => null);
        throw new Error(detail && detail.error ? detail.error : 'HTTP ' + response.status);
      }
      const data = await response.json();
      if (!data || typeof data !== 'object') throw new Error('Invalid response');
      if (seq !== state.fetchSeq) return;
      state.data = data;
      state.derived = derive(data);
      state.error = '';
      state.lastUpdated = Date.now();
      renderAll();
      updateChrome();
      updateUpdated();
      if (reload) {
        const result = data.reloaded || {};
        const added = Number(result.added) || 0;
        const removed = Number(result.removed) || 0;
        showToast(added || removed ? t('keysReloaded', { added, removed }) : t('keysReloadedNoChange'));
      } else if (probe) {
        const checked = Number(data.probed);
        showToast(Number.isFinite(checked) ? t('balancesRefreshedN', { n: checked }) : t('balancesRefreshed'));
      }
    } catch (error) {
      if (seq !== state.fetchSeq) return;
      state.error = error && error.message ? error.message : String(error);
      if (!state.data) renderDisconnected();
      else {
        renderBanner(state.derived);
        updateStatus();
        updateChrome();
      }
      updateUpdated();
      if (reload) showToast(t('reloadFailed', { error: state.error }), true);
      else if (probe) showToast(t('refreshFailed', { error: state.error }), true);
    } finally {
      if (seq === state.fetchSeq) {
        state.loading = false;
        if (probe) setRefreshLoading(false);
        if (reload) setReloadLoading(false);
      }
    }
  }

  function showToast(message, isError) {
    const toast = $('toast');
    toast.textContent = message;
    toast.classList.toggle('error', Boolean(isError));
    toast.classList.add('show');
    if (state.toastTimer) clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => toast.classList.remove('show'), 3600);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      showToast(t('keyCopied'));
      return;
    } catch (e) {}
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.append(area);
    area.select();
    try {
      document.execCommand('copy');
      showToast(t('keyCopied'));
    } catch (e) {
      showToast(t('copyFailed'), true);
    } finally {
      area.remove();
    }
  }

  async function restoreKey(key, button) {
    if (!window.confirm(t('restoreConfirm', { name: nameOf(key) }))) return;
    button.disabled = true;
    try {
      const response = await fetch('/dashboard/keys/' + encodeURIComponent(key.id) + '/restore', { method: 'POST' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      showToast(t('restored'));
      await fetchData({ force: true });
    } catch (error) {
      showToast(t('restoreFailed', { error: error && error.message ? error.message : error }), true);
      button.disabled = false;
    }
  }

  function toggleLive() {
    state.live = !state.live;
    storageSet('dspool-live', state.live ? '1' : '0');
    updateLiveButton();
    schedule();
    if (state.live) fetchData({ force: true });
  }

  function toggleTheme() {
    const explicit = document.documentElement.dataset.theme;
    const dark = explicit === 'dark' || (!explicit && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    storageSet('dspool-theme', next);
    updateThemeButton();
  }

  function init() {
    if (!SORTS.includes(state.sort)) state.sort = 'state';
    updateFormatters();
    document.title = t('documentTitle');
    applyStaticI18n();
    initFilters();
    updateLanguageButtons();
    updateChrome();
    $('sort').value = state.sort;
    renderDisconnected();

    document.querySelectorAll('[data-lang]').forEach((button) => {
      button.addEventListener('click', () => setLanguage(button.dataset.lang));
    });
    $('live-btn').addEventListener('click', toggleLive);
    $('theme-btn').addEventListener('click', toggleTheme);
    $('refresh-btn').addEventListener('click', () => fetchData({ probe: true, force: true }));
    $('reload-btn').addEventListener('click', () => fetchData({ reload: true, force: true }));
    $('search').addEventListener('input', (event) => {
      state.query = event.target.value.trim();
      renderRows(state.derived);
    });
    $('sort').addEventListener('change', (event) => {
      state.sort = event.target.value;
      storageSet('dspool-sort', state.sort);
      renderRows(state.derived);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state.live) fetchData();
    });
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (!document.documentElement.dataset.theme) updateThemeButton();
      });
    } catch (e) {}

    schedule();
    fetchData();
    setInterval(() => {
      updateUpdated();
      updateCountdowns();
    }, 1000);
  }

  init();
})();
</script>
</body>
</html>
