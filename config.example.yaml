# dspool configuration. Copy to config.yaml and edit.
# config.yaml, keys.txt, and data/ are gitignored.

listen: 127.0.0.1:8787
state_file: data/state.json
log_level: info
# Empty: serve logs to stderr; agent shortcuts log to <state_dir>/dspool-agent.log.
log_file: ""

# Tokens accepted by the proxy. Empty accepts any token (local use only).
client_keys:
  - dspool-local

# Token for /admin/*. Empty keeps admin endpoints loopback-only.
admin_token: ""

max_body_bytes: 67108864

upstream:
  anthropic_base: https://api.deepseek.com/anthropic
  openai_base: https://api.deepseek.com/v1
  balance_url: https://api.deepseek.com/user/balance
  request_header_timeout: 180s
  probe_timeout: 15s
  # Optional max_tokens clamp; 0 disables it.
  max_tokens_cap: 0
  anthropic_version: "2023-06-01"

pool:
  # spread | weighted | highest | drain | round_robin
  # spread uses the least-loaded key and drains smaller balances first when idle.
  strategy: spread
  # Maximum upstream keys tried per client request.
  max_attempts: 4
  # Local concurrency cap per key; 0 = unlimited.
  max_inflight_per_key: 0
  # In-flight penalty for the weighted strategy.
  inflight_penalty: 1.0
  # Keys below this balance stay in the cold pool (0 = any positive balance is usable).
  min_balance: 0
  # Hot-pool balance check interval.
  balance_interval: 30s
  # Cold-pool check interval while waiting for a top-up.
  cold_check_interval: 2m
  # Startup probe budget. After this, keys are allowed optimistically and probed again in the background.
  startup_probe_timeout: 30s
  rate_limit_cooldown: 30s
  error_cooldown: 10s
  # Check the cold pool immediately when no hot key is available.
  refresh_cold_on_exhaustion: true
  exhaustion_refresh_cooldown: 10s

models:
  # Fallback for non-DeepSeek model names.
  default: deepseek-flash
  # Used for Claude Code's haiku-style background requests.
  small: deepseek-flash
  # Exact names or glob patterns.
  map: {}
  # map:
  #   "claude-opus*": deepseek-v4-pro
  #   "claude-sonnet*": deepseek-flash

responses:
  # auto | enabled | disabled
  thinking: auto

# Keys can be listed in keys_file or inline.
keys_file: keys.txt
keys: []
# keys:
#   - label: main
#     key: sk-xxxxxxxx
#   - sk-yyyyyyyy
