# dspool 配置模板。复制为 config.yaml 后按需修改。
# config.yaml / keys.txt / data/ 已在 .gitignore 中，不会被提交。

listen: 127.0.0.1:8787
state_file: data/state.json
log_level: info

# 代理客户端令牌（Claude Code / Codex / pi 用同一个即可）。
# 留空则接受任意 token，仅适合本机。
client_keys:
  - dspool-local

# /admin/* 的令牌。留空时 admin 仅允许 loopback 访问。
admin_token: ""

max_body_bytes: 67108864

upstream:
  anthropic_base: https://api.deepseek.com/anthropic
  openai_base: https://api.deepseek.com/v1
  balance_url: https://api.deepseek.com/user/balance
  request_header_timeout: 180s
  probe_timeout: 15s
  # 可选：强制截断客户端请求的 max_tokens；0 表示不截断。
  max_tokens_cap: 0
  anthropic_version: "2023-06-01"

pool:
  # spread | weighted | highest | drain | round_robin
  # 默认 spread：尽量同时使用所有 key，适合这些 key 也被别人使用、
  # 希望本地吞吐/余额利用率最大的场景。
  strategy: spread
  # 单个客户端请求最多尝试多少个上游 key。
  max_attempts: 4
  # 每个 key 的本地并发上限；0 = 不限制。
  max_inflight_per_key: 0
  # weighted 策略中，in-flight 对权重的惩罚系数。
  inflight_penalty: 1.0
  # 低于该余额的 key 会留在冷池（0 = 只要 > 0 就可用）。
  min_balance: 0
  # 热池余额检查间隔。
  balance_interval: 30s
  # 冷池检查（等别人充值）间隔。
  cold_check_interval: 2m
  # 启动时阻塞探活的超时；超时后乐观放行，后台继续检查。
  startup_probe_timeout: 30s
  rate_limit_cooldown: 30s
  error_cooldown: 10s
  # 没有可用热 key 时，立刻同步检查冷池，以便刚充值后马上恢复。
  refresh_cold_on_exhaustion: true
  exhaustion_refresh_cooldown: 10s

models:
  # 非 deepseek-* 的模型名默认改写为下面这个模型。
  default: deepseek-flash
  # 带 haiku 的模型名（Claude Code 的后台小任务）使用这个模型。
  small: deepseek-flash
  # 精确名或 glob 模式。
  map: {}
  # map:
  #   "claude-opus*": deepseek-v4-pro
  #   "claude-sonnet*": deepseek-flash

responses:
  # Codex / pi 的 Responses 请求如何映射到 DeepSeek thinking：
  # auto = 跟随 reasoning.effort（none 关闭思考）
  # enabled / disabled = 强制开启或关闭
  thinking: auto

# keys 可以写在 keys_file 里，也可以直接内联。
keys_file: keys.txt
keys: []
# keys:
#   - label: main
#     key: sk-xxxxxxxx
#   - sk-yyyyyyyy
